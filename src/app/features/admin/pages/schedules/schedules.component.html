<div class="page-header">
  <div class="page-title-section">
    <h2 class="page-title">
      <span nz-icon nzType="calendar" nzTheme="outline"></span> Quản lý lịch học
    </h2>
    <p class="page-subtitle">Quản lý thông tin lịch học và thời khóa biểu</p>
  </div>
  <div class="page-actions">
    <span class="total">Tổng số: {{ schedules.length }}</span>
  </div>
</div>

<div class="card">
  <nz-table
    [nzBordered]="false"
    [nzData]="schedules"
    [nzShowPagination]="false"
    [nzSize]="'middle'"
    [nzLoading]="isLoading"
  >
    <thead>
      <tr>
        <th nzAlign="center">STT</th>
        <th nzAlign="center">Tên lịch học</th>
        <th nzAlign="center">Mô tả</th>
        <th nzAlign="center">Thời gian</th>
        <th nzAlign="center">Ngày trong tuần</th>
        <th nzAlign="center">Hành động</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let schedule of schedules; index as i">
        <td nzAlign="center">{{ i + 1 }}</td>
        <td nzAlign="center">
          <div class="schedule-name">
            <span nz-icon nzType="calendar" nzTheme="outline" class="schedule-icon"></span>
            <strong>{{ schedule.name }}</strong>
          </div>
        </td>
        <td nzAlign="center">{{ schedule.description || 'Không có mô tả' }}</td>
        <td nzAlign="center">
          <span>{{ getScheduleTimeRange(schedule) }}</span>
        </td>
        <td nzAlign="center">
          <div class="days-tags-container">
            <nz-tag nzColor="blue" *ngFor="let day of getScheduleDays(schedule).split(', ')">
              {{ day }}
            </nz-tag>
          </div>
        </td>
        <td nzAlign="center">
          <div class="action-buttons">
            <button
              nz-button
              nzType="default"
              nzShape="circle"
              nzSize="small"
              class="btn-view"
              nz-tooltip="Xem chi tiết"
              (click)="viewSchedule(schedule)"
            >
              <span nz-icon nzType="eye" nzTheme="outline"></span>
            </button>
          </div>
        </td>
      </tr>
    </tbody>
  </nz-table>
</div>
