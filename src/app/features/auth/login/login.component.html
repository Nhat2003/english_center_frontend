<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <img src="assets/logo.png" alt="Logo" class="login-logo" />
      <h2>Đăng nhập hệ thống</h2>
      <p>Chào mừng bạn đến với English Center</p>
    </div>
    <form [formGroup]="form" (ngSubmit)="submitForm()" class="login-form">
      <div class="form-group">
        <label for="username">Tên đăng nhập</label>
        <input id="username" formControlName="username" type="text" placeholder="Nhập tên đăng nhập" />
      </div>
      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <input id="password" formControlName="password" type="password" placeholder="Nhập mật khẩu" />
      </div>
      <button type="submit" class="login-btn" [disabled]="form.invalid">Đăng nhập</button>
      <div class="login-links">
        <a routerLink="/auth/register">Chưa có tài khoản? Đăng ký</a>
        <a href="#">Quên mật khẩu?</a>
      </div>
    </form>
  </div>
</div>
