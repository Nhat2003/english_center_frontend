<div class="page-header">
  <div class="page-title-section">
    <h2 class="page-title">
      <span nz-icon nzType="user" nzTheme="outline"></span> Quản lý tài khoản
    </h2>
    <p class="page-subtitle">Quản lý tài khoản hệ thống và quyền của họ</p>
  </div>
  <div class="page-actions">
    <span class="total">Tổng số: {{ totalUsers }}</span>
    <button nz-button nzType="primary" class="btn-add" (click)="openAddUser()">
      <span nz-icon nzType="plus" ></span> Thêm tài khoản mới
    </button>
  </div>
</div>

<!-- Search Bar -->
<div class="search-bar">
  <nz-input-group [nzPrefix]="prefixIconSearch" nzSize="large">
    <input
      nz-input
      type="text"
      placeholder="Tìm kiếm theo tên đăng nhập, họ tên, vai trò..."
      [(ngModel)]="searchText"
      (ngModelChange)="onSearch()"
    />
  </nz-input-group>
</div>
<ng-template #prefixIconSearch>
  <span nz-icon nzType="search"></span>
</ng-template>

<!-- Bảng người dùng -->
<div class="card">
  <nz-table
    [nzBordered]="false"
    [nzData]=" users"
    [nzShowPagination]="false"
    [nzSize]="'middle'"
  >
    <thead>
      <tr>
        <th>Tên đăng nhập</th>
        <th>Họ và tên</th>
        <th>Vai trò</th>
        <th>Trạng thái</th>
        <th>Hành động</th>
      </tr>
    </thead>
    <tbody>
  <tr *ngFor="let user of paginatedUsers">
        <td>{{ user.username }}</td>
        <td>{{ user.fullName || user.student?.fullName || 'Chưa cập nhật' }}</td>
        <td>{{ getRoleLabel(user.role) }}</td>
        <td>
          <nz-tag *ngIf="isUserActive(user)" style="color: #5bc069;" [nzColor]="'#d9eed9'">Hoạt động</nz-tag>
          <nz-tag *ngIf="!isUserActive(user)" [nzColor]="'#d9d9d9'">Không hoạt động</nz-tag>
        </td>
        <td>
          <div class="action-buttons">
            <button
              nz-button
              nzType="default"
              nzShape="circle"
              class="btn-view"
              (click)="viewUser(user)"
              nz-tooltip="Xem chi tiết"
              title="Xem chi tiết"
            >
              <span nz-icon nzType="eye"></span>
            </button>
            <button
              nz-button
              nzType="default"
              nzShape="circle"
              class="btn-edit"
              (click)="openEditUser(user)"
              nz-tooltip="Chỉnh sửa"
              title="Chỉnh sửa"
            >
              <span nz-icon nzType="edit"></span>
            </button>
            <button
              nz-button
              nzType="primary"
              nzDanger
              nzShape="circle"
              class="btn-delete"
              (click)="deleteUser(user)"
              nz-tooltip="Xóa"
              title="Xóa"
            >
              <span nz-icon nzType="delete"></span>
            </button>
          </div>
        </td>
      </tr>
    </tbody>
  </nz-table>
  <div class="table-pagination">
    <nz-pagination
      [nzPageIndex]="pageIndex"
      [nzTotal]="totalUsers"
      [nzPageSize]="pageSize"
      [nzPageSizeOptions]="[5, 10, 20]"
      (nzPageIndexChange)="onPageIndexChange($event)"
      (nzPageSizeChange)="onPageSizeChange($event)"
      [nzShowSizeChanger]="true"
      [nzShowQuickJumper]="true"
    ></nz-pagination>
  </div>
</div>
