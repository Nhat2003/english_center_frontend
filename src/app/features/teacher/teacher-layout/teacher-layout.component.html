<nz-layout class="teacher-layout">
  <!-- Header -->
  <nz-header class="header">
    <div class="logo">
      <button
        nz-button
        nzType="text"
        nzSize="large"
        (click)="isCollapsed = !isCollapsed"
        class="trigger"
        [nz-tooltip]="isCollapsed ? 'Mở rộng menu' : 'Thu gọn menu'"
        nzTooltipPlacement="right"
        [title]="isCollapsed ? 'Mở rộng menu' : 'Thu gọn menu'">
        <span nz-icon [nzType]="isCollapsed ? 'menu-unfold' : 'menu-fold'"></span>
      </button>
      <div class="logo-wrapper">
        <div class="logo-icon">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <!-- Graduation Cap -->
            <path d="M50 20 L10 35 L50 50 L90 35 L50 20 Z" fill="#3bb273"/>
            <path d="M50 50 L90 35 L90 55 L50 70 L10 55 L10 35 L50 50 Z" fill="#2d9960" opacity="0.8"/>
            <!-- Tassel -->
            <circle cx="50" cy="20" r="3" fill="#faad14"/>
            <line x1="50" y1="20" x2="50" y2="12" stroke="#faad14" stroke-width="2"/>
          </svg>
        </div>
        <div class="logo-text">
          <div class="brand-name">TOEIC DOWNTOWN</div>
          <div class="brand-subtitle">Teacher Portal</div>
        </div>
      </div>
    </div>

    <div class="header-right">
      <nz-dropdown nzTrigger="click" [nzPlacement]="'bottomRight'">
        <div class="user-info" nz-dropdown>
          <nz-avatar nzIcon="user" [nzSize]="32"></nz-avatar>
          <span class="username">{{ currentUser?.fullName || currentUser?.username }}</span>
          <span nz-icon nzType="down"></span>
        </div>
        <ul nz-menu nzSelectable="false">
          <li nz-menu-item [routerLink]="['/teacher/profile-settings']">
            <span nz-icon nzType="user"></span>
            Thông tin cá nhân
          </li>
          <li nz-menu-item>
            <span nz-icon nzType="setting"></span>
            Cài đặt
          </li>
          <li nz-menu-divider></li>
          <li nz-menu-item (click)="logout()">
            <span nz-icon nzType="logout"></span>
            Đăng xuất
          </li>
        </ul>
      </nz-dropdown>


    </div>
  </nz-header>

  <nz-layout>
    <!-- Sidebar - Main Menu -->
    <nz-sider
      *ngIf="!isClassManagementMode"
      class="sidebar"
      nzCollapsible
      [(nzCollapsed)]="isCollapsed"
      [nzTrigger]="null"
      nzWidth="250px">
      <ul nz-menu nzMode="inline" [nzInlineCollapsed]="isCollapsed" class="sidebar-menu">

        <!-- Trang chủ -->
        <li nz-menu-item routerLink="/teacher/dashboard" routerLinkActive="ant-menu-item-selected">
          <span nz-icon nzType="home" class="menu-icon"></span>
          <span>Trang chủ</span>
        </li>

        <!-- Lịch dạy -->
        <li nz-menu-item routerLink="/teacher/schedule" routerLinkActive="ant-menu-item-selected">
          <span nz-icon nzType="calendar" class="menu-icon"></span>
          <span>Lịch dạy</span>
        </li>

        <!-- Danh sách lớp & học sinh -->
        <li nz-menu-item routerLink="/teacher/classes" routerLinkActive="ant-menu-item-selected">
          <span nz-icon nzType="team" class="menu-icon"></span>
          <span>Danh sách lớp</span>
        </li>


        <!-- Thông báo cho học sinh -->
        <li nz-menu-item routerLink="/teacher/notifications" routerLinkActive="ant-menu-item-selected">
          <span nz-icon nzType="bell" class="menu-icon"></span>

          <span>Thông báo</span>
          <nz-badge [nzCount]="newNotifications" [nzShowZero]="false" class="notification-badge"></nz-badge>
        </li>

      </ul>
    </nz-sider>

    <!-- Sidebar - Class Management Menu -->
    <nz-sider
      *ngIf="isClassManagementMode"
      class="sidebar"
      nzCollapsible
      [(nzCollapsed)]="isCollapsed"
      [nzTrigger]="null"
      nzWidth="250px">

      <!-- Class Header -->
      <div class="class-sidebar-header" *ngIf="!isCollapsed">
        <h3 class="class-name">{{ currentClassInfo?.name || 'Quản lý lớp' }}</h3>
        <button nz-button nzType="text" nzSize="small" (click)="backToClasses()" class="back-button">
          <span nz-icon nzType="arrow-left"></span>
          Quay lại
        </button>
      </div>
      <div class="class-sidebar-header-collapsed" *ngIf="isCollapsed">
        <button nz-button nzType="text" nzSize="small" (click)="backToClasses()" class="back-button-collapsed" nz-tooltip="Quay lại danh sách lớp" nzTooltipPlacement="right" title="Quay lại danh sách lớp">
          <span nz-icon nzType="arrow-left"></span>
        </button>
      </div>

      <ul nz-menu nzMode="inline" [nzInlineCollapsed]="isCollapsed" class="sidebar-menu">
        <!-- Danh sách học sinh -->
        <li nz-menu-item [routerLink]="['/teacher/classes', currentClassId, 'students']" routerLinkActive="ant-menu-item-selected">
          <span nz-icon nzType="team" class="menu-icon"></span>
          <span>Danh sách học sinh</span>
        </li>

        <!-- Bài tập -->
        <li nz-menu-item [routerLink]="['/teacher/classes', currentClassId, 'assignments']" routerLinkActive="ant-menu-item-selected">
          <span nz-icon nzType="file-text" class="menu-icon"></span>
          <span>Bài tập</span>
        </li>

        <!-- Tài liệu -->
        <li nz-menu-item [routerLink]="['/teacher/classes', currentClassId, 'materials']" routerLinkActive="ant-menu-item-selected">
          <span nz-icon nzType="book" class="menu-icon"></span>
          <span>Tài liệu</span>
        </li>

        <!-- Điểm danh -->
        <li nz-menu-item [routerLink]="['/teacher/classes', currentClassId, 'attendance']" routerLinkActive="ant-menu-item-selected">
          <span nz-icon nzType="check-square" class="menu-icon"></span>
          <span>Điểm danh</span>
        </li>

        <!-- Đổi lịch học -->
        <!-- <li nz-menu-item [routerLink]="['/teacher/classes', currentClassId, 'edit-schedule']" routerLinkActive="ant-menu-item-selected">
          <span nz-icon nzType="calendar" class="menu-icon"></span>
          <span>Đổi lịch học</span>
        </li> -->
      </ul>
    </nz-sider>

    <!-- Content -->
    <nz-layout class="inner-layout">
      <nz-content class="content">
        <div class="content-wrapper">
          <app-breadcrumb></app-breadcrumb>
          <router-outlet></router-outlet>
        </div>
      </nz-content>
    </nz-layout>
  </nz-layout>
</nz-layout>

<!-- Chatbox -->
<app-chatbox></app-chatbox>
