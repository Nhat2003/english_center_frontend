<div style="max-width: 400px; margin: 50px auto;">
  <h2>Đăng ký</h2>
  <form nz-form [formGroup]="form" (ngSubmit)="submitForm()">
    <nz-form-item>
      <nz-form-label [nzSm]="8" nzFor="username" nzRequired>Tài khoản</nz-form-label>
      <nz-form-control [nzSm]="16">
        <input nz-input formControlName="username" id="username" placeholder="Nhập tài khoản" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label [nzSm]="8" nzFor="password" nzRequired>Mật khẩu</nz-form-label>
      <nz-form-control [nzSm]="16">
        <input nz-input type="password" formControlName="password" id="password" placeholder="Nhập mật khẩu" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label [nzSm]="8" nzFor="confirmPassword" nzRequired>Nhập lại MK</nz-form-label>
      <nz-form-control [nzSm]="16">
        <input nz-input type="password" formControlName="confirmPassword" id="confirmPassword" placeholder="Nhập lại mật khẩu" />
      </nz-form-control>
    </nz-form-item>

    <button nz-button nzType="primary" [disabled]="form.invalid">Đăng ký</button>
    <a routerLink="/auth/login" style="margin-left: 10px;">Đăng nhập</a>
  </form>
</div>
