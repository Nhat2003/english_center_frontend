<div class="page-header">
  <div class="page-title-section">
    <h2 class="page-title">
      <span nz-icon nzType="book" nzTheme="outline"></span> Quản lý khóa học
    </h2>
    <p class="page-subtitle">Quản lý thông tin khóa học và học phí</p>
  </div>
  <div class="page-actions">
    <span class="total">Tổng số: {{ total }}</span>
    <button nz-button nzType="primary" class="btn-add" (click)="openAddCourseModal()">
      <span nz-icon nzType="plus"></span> Thêm khóa học
    </button>
  </div>
</div>

<div class="card">
  <nz-table
    [nzBordered]="false"
    [nzData]="courses"
    [nzShowPagination]="false"
    [nzSize]="'middle'"
    [nzLoading]="loading"
  >
    <thead>
      <tr>
        <th nzAlign="center">STT</th>
        <th nzAlign="center">Tên khóa học</th>
        <th nzAlign="center">Mô tả</th>
        <th nzAlign="center">Thời lượng</th>
        <th nzAlign="center">Học phí</th>
        <th nzAlign="center">Hành động</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of courses; index as i">
        <td nzAlign="center">{{ (pageIndex - 1) * pageSize + i + 1 }}</td>
        <td nzAlign="center">
          <div class="course-name">
            <span nz-icon nzType="book" nzTheme="outline" class="course-icon"></span>
            <strong>{{ c.name }}</strong>
          </div>
        </td>
        <td nzAlign="center">{{ c.description || 'Chưa có mô tả' }}</td>
        <td nzAlign="center">{{ c.duration }} buổi</td>
        <td nzAlign="center">{{ c.fee | currency:'VND':'symbol':'1.0-0' }}</td>
        <td nzAlign="center">
          <div class="action-buttons">
            <button
              nz-button
              nzType="default"
              nzShape="circle"
              nzSize="small"
              class="btn-view"
              nz-tooltip="Xem chi tiết"
              (click)="viewCourse(c)"
            >
              <span nz-icon nzType="eye" nzTheme="outline"></span>
            </button>
            <button
              nz-button
              nzType="primary"
              nzShape="circle"
              nzSize="small"
              class="btn-edit"
              nz-tooltip="Chỉnh sửa"
              (click)="editCourse(c)"
            >
              <span nz-icon nzType="edit" nzTheme="outline"></span>
            </button>
            <button
              nz-button
              nzType="primary"
              nzDanger
              nzShape="circle"
              nzSize="small"
              class="btn-delete"
              nz-tooltip="Xóa khóa học"
              (click)="deleteCourse(c)"
            >
              <span nz-icon nzType="delete" nzTheme="outline"></span>
            </button>
          </div>
        </td>
      </tr>
    </tbody>
  </nz-table>
  <div class="table-pagination">
    <nz-pagination
      [nzPageIndex]="pageIndex"
      [nzTotal]="total"
      [nzPageSize]="pageSize"
      [nzPageSizeOptions]="[10, 20, 50]"
      (nzPageIndexChange)="onPageIndexChange($event)"
      (nzPageSizeChange)="onPageSizeChange($event)"
      [nzShowSizeChanger]="true"
      [nzShowQuickJumper]="true"
    ></nz-pagination>
  </div>
</div>
