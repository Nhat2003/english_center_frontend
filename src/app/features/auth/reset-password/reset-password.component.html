<div class="reset-password-container">
  <nz-card class="reset-password-card" [nzBordered]="false">
    <div class="reset-header">
      <div class="logo-section">
        <div class="brand-logo-wrapper">
          <div class="logo-circle">
            <span nz-icon nzType="lock" nzTheme="outline" class="logo-icon"></span>
          </div>
          <div class="brand-text">
            <h1 class="brand-name">TOEIC DOWNTOWN</h1>
            <p class="brand-slogan">Excellence in English Education</p>
          </div>
        </div>
        <h2>Đặt lại mật khẩu</h2>
        <p *ngIf="tokenValid">Vui lòng nhập mật khẩu mới của bạn</p>
      </div>
    </div>

    <!-- Loading Spinner (Validating Token) -->
    <div *ngIf="validatingToken" class="loading-container" style="text-align: center; padding: 40px 0;">
      <nz-spin nzSimple [nzSize]="'large'"></nz-spin>
      <p style="margin-top: 16px; color: #666;">Đang xác thực liên kết...</p>
    </div>

    <!-- Error Message (Invalid/Expired Token) -->
    <div *ngIf="!validatingToken && !tokenValid" style="padding: 20px 0;">
      <nz-result
        nzStatus="error"
        nzTitle="Liên kết không hợp lệ"
        [nzSubTitle]="errorMessage"
      >
        <div nz-result-extra>
          <button nz-button nzType="primary" (click)="backToLogin()">
            Quay lại đăng nhập
          </button>
        </div>
      </nz-result>
    </div>

    <!-- Reset Password Form (Only show if token is valid) -->
    <form *ngIf="!validatingToken && tokenValid" nz-form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="reset-form">
      <nz-alert
        nzType="info"
        nzMessage="Mật khẩu phải có ít nhất 6 ký tự"
        nzShowIcon
        style="margin-bottom: 24px;">
      </nz-alert>

      <!-- New Password -->
      <nz-form-item>
        <nz-form-label nzRequired nzFor="newPassword">Mật khẩu mới</nz-form-label>
        <nz-form-control nzErrorTip="Mật khẩu phải có ít nhất 6 ký tự">
          <nz-input-group [nzSuffix]="toggleTpl1">
            <input
              nz-input
              id="newPassword"
              [type]="passwordVisible1 ? 'text' : 'password'"
              formControlName="newPassword"
              placeholder="Nhập mật khẩu mới"
              autocomplete="new-password"
            />
          </nz-input-group>
          <ng-template #toggleTpl1>
            <i
              nz-icon
              class="password-toggle"
              [nzType]="passwordVisible1 ? 'eye-invisible' : 'eye'"
              (click)="togglePasswordVisibility1()"
            ></i>
          </ng-template>
        </nz-form-control>
      </nz-form-item>

      <!-- Confirm Password -->
      <nz-form-item>
        <nz-form-label nzRequired nzFor="confirmPassword">Xác nhận mật khẩu</nz-form-label>
        <nz-form-control [nzErrorTip]="resetForm.hasError('mismatch') ? 'Mật khẩu xác nhận không khớp' : 'Vui lòng xác nhận mật khẩu'">
          <nz-input-group [nzSuffix]="toggleTpl2">
            <input
              nz-input
              id="confirmPassword"
              [type]="passwordVisible2 ? 'text' : 'password'"
              formControlName="confirmPassword"
              placeholder="Nhập lại mật khẩu mới"
              autocomplete="new-password"
            />
          </nz-input-group>
          <ng-template #toggleTpl2>
            <i
              nz-icon
              class="password-toggle"
              [nzType]="passwordVisible2 ? 'eye-invisible' : 'eye'"
              (click)="togglePasswordVisibility2()"
            ></i>
          </ng-template>
        </nz-form-control>
      </nz-form-item>

      <!-- Submit Button -->
      <nz-form-item>
        <nz-form-control>
          <button
            nz-button
            nzType="primary"
            nzSize="large"
            [nzLoading]="isResetting"
            [disabled]="resetForm.invalid || resetForm.disabled"
            type="submit"
            class="reset-btn"
          >
            <span nz-icon nzType="check" nzTheme="outline"></span>
            Đặt lại mật khẩu
          </button>
        </nz-form-control>
      </nz-form-item>

      <div class="reset-links">
        <a (click)="backToLogin()" class="back-login">
          <span nz-icon nzType="arrow-left"></span>
          Quay lại đăng nhập
        </a>
      </div>
    </form>
  </nz-card>
</div>
