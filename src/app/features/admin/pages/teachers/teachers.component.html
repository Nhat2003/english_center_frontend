<div class="page-header">
  <div class="page-title-section">
    <h2 class="page-title">
      <span nz-icon nzType="team" nzTheme="outline"></span> Quản lý giáo viên
    </h2>
    <p class="page-subtitle">Quản lý thông tin giáo viên và môn giảng dạy</p>
  </div>
  <div class="page-actions">
    <span class="total">Tổng số: {{ teachers.length }}</span>
    <button nz-button nzType="primary" class="btn-add" (click)="openAddTeacherModal()">
      <span nz-icon nzType="plus"></span> Thêm giáo viên
    </button>
  </div>
</div>

<div class="card">
  <nz-table
    [nzBordered]="false"
    [nzData]="paginatedTeachers"
    [nzShowPagination]="false"
    [nzSize]="'middle'"
    [nzLoading]="loading"
  >
    <thead>
      <tr>
        <th>STT</th>
        <th>Họ và tên</th>
        <th>Email</th>
        <th>Số điện thoại</th>
        <th>Môn giảng dạy</th>
        <th>Hành động</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let t of paginatedTeachers; index as i">
        <td>{{ (pageIndex - 1) * pageSize + i + 1 }}</td>
        <td>
          <div class="teacher-name">
            <span nz-icon nzType="user" nzTheme="outline" class="teacher-icon"></span>
            <strong>{{ t.name }}</strong>
          </div>
        </td>
        <td>
          <span class="email-text">{{ t.email }}</span>
        </td>
        <td>
          <span class="phone-text">{{ t.phone }}</span>
        </td>
        <td>
          <nz-tag nzColor="blue">{{ t.subject }}</nz-tag>
        </td>
        <td>
          <div class="action-buttons">
            <button
              nz-button
              nzType="default"
              nzShape="circle"
              nzSize="small"
              class="btn-view"
              nz-tooltip="Xem chi tiết"
              (click)="viewTeacher(t)"
            >
              <span nz-icon nzType="eye" nzTheme="outline"></span>
            </button>
            <button
              nz-button
              nzType="primary"
              nzShape="circle"
              nzSize="small"
              class="btn-edit"
              nz-tooltip="Chỉnh sửa"
              (click)="editTeacher(t)"
            >
              <span nz-icon nzType="edit" nzTheme="outline"></span>
            </button>
            <button
              nz-button
              nzType="primary"
              nzDanger
              nzShape="circle"
              nzSize="small"
              class="btn-delete"
              nz-tooltip="Xóa giáo viên"
              (click)="deleteTeacher(t)"
            >
              <span nz-icon nzType="delete" nzTheme="outline"></span>
            </button>
          </div>
        </td>
      </tr>
    </tbody>
  </nz-table>
  <div class="table-pagination">
    <nz-pagination
      [nzPageIndex]="pageIndex"
      [nzTotal]="teachers.length"
      [nzPageSize]="pageSize"
      [nzPageSizeOptions]="[5, 10, 20]"
      (nzPageIndexChange)="onPageIndexChange($event)"
      (nzPageSizeChange)="onPageSizeChange($event)"
      [nzShowSizeChanger]="true"
      [nzShowQuickJumper]="true"
    ></nz-pagination>
  </div>
</div>
