<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#3bb273"/>

  <!-- Graduation Cap -->
  <g transform="translate(0, 10)">
    <!-- Cap top -->
    <path d="M50 25 L20 37 L50 49 L80 37 L50 25 Z" fill="#ffffff"/>

    <!-- Cap bottom with shadow -->
    <path d="M50 49 L80 37 L80 52 L50 64 L20 52 L20 37 L50 49 Z" fill="#e0e0e0"/>

    <!-- Tassel -->
    <circle cx="50" cy="25" r="2.5" fill="#faad14"/>
    <line x1="50" y1="25" x2="50" y2="19" stroke="#faad14" stroke-width="1.5"/>
    <circle cx="50" cy="18" r="1.5" fill="#faad14"/>
  </g>

  <!-- Optional: Add shine effect -->
  <circle cx="35" cy="35" r="8" fill="white" opacity="0.2"/>
</svg>
