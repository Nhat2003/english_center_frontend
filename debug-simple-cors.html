<!DOCTYPE html>
<html>
<head>
    <title>Simple CORS Test</title>
</head>
<body>
    <h2>Simple CORS Test</h2>
    <button onclick="testSimpleCORS()">Test Simple GET (no auth)</button>
    <div id="result" style="margin-top: 10px; padding: 10px; border: 1px solid #ccc; min-height: 100px; white-space: pre-wrap;"></div>

    <script>
        async function testSimpleCORS() {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = 'Testing simple CORS...';
            
            try {
                // Test simple GET without Authorization header
                const response = await fetch('http://localhost:8080/users', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const text = await response.text();
                resultDiv.textContent = 
                    `Simple CORS Test Result:\n` +
                    `Status: ${response.status} ${response.statusText}\n` +
                    `Response: ${text}`;
                    
            } catch (error) {
                resultDiv.textContent = 
                    `Simple CORS Test Error:\n` +
                    `${error.message}\n\n` +
                    `If you see this error, CORS is not configured properly on backend.`;
            }
        }
    </script>
</body>
</html>
