<div class="card shadow-sm p-4" style="border-radius: 12px; max-width: 500px; margin: 0 auto; background: #fff;">
  <form nz-form [formGroup]="form" (ngSubmit)="onSubmit()" nzLayout="vertical">
    <div class="form-header mb-4 d-flex align-items-center">
      <div class="avatar bg-primary text-white d-flex align-items-center justify-content-center me-3" style="width:48px;height:48px;border-radius:50%;font-size:24px;">
        <i nz-icon nzType="team" nzTheme="outline"></i>
      </div>
      <div class="title" style="font-size:1.2rem;font-weight:500;">Thêm mới lớp học</div>
    </div>
    <nz-form-item>
      <nz-form-label [nzRequired]="true" nzFor="name">Tên lớp học</nz-form-label>
      <nz-form-control>
        <input nz-input formControlName="name" id="name" placeholder="Nhập tên lớp học" />
      </nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <nz-form-label [nzRequired]="true" nzFor="course">Khóa học</nz-form-label>
      <nz-form-control>
        <input nz-input formControlName="course" id="course" placeholder="Nhập tên khóa học" />
      </nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <nz-form-label [nzRequired]="true" nzFor="teacher">Giáo viên phụ trách</nz-form-label>
      <nz-form-control>
        <input nz-input formControlName="teacher" id="teacher" placeholder="Nhập tên giáo viên" />
      </nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <nz-form-label [nzRequired]="true" nzFor="schedule">Lịch học</nz-form-label>
      <nz-form-control>
        <input nz-input formControlName="schedule" id="schedule" placeholder="Nhập lịch học" />
      </nz-form-control>
    </nz-form-item>
    <div class="form-footer d-flex justify-content-end mt-4 gap-2">
      <button nz-button nzType="default" (click)="onCancel()" type="button">Huỷ</button>
      <button nz-button nzType="primary" [disabled]="form.invalid">Lưu</button>
    </div>
  </form>
</div>
