<!DOCTYPE html>
<html>
<head>
    <title>CORS Test</title>
</head>
<body>
    <h2>CORS Test Tool</h2>
    
    <div>
        <h3>Test CORS với JavaScript fetch:</h3>
        <button onclick="testCORS()">Test CORS to Backend</button>
        <button onclick="testWithToken()">Test with Token</button>
        <div id="corsResult" style="margin-top: 10px; padding: 10px; border: 1px solid #ccc; min-height: 100px; white-space: pre-wrap;"></div>
    </div>

    <script>
        async function testCORS() {
            const resultDiv = document.getElementById('corsResult');
            resultDiv.textContent = 'Testing CORS...';
            
            try {
                const response = await fetch('http://localhost:8080/users', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include'
                });
                
                const text = await response.text();
                resultDiv.textContent = 
                    `CORS Test Result:\n` +
                    `Status: ${response.status} ${response.statusText}\n` +
                    `Response: ${text}`;
                    
            } catch (error) {
                resultDiv.textContent = 
                    `CORS Test Error:\n` +
                    `${error.message}\n\n` +
                    `This indicates a CORS configuration issue.`;
            }
        }

        async function testWithToken() {
            const token = localStorage.getItem('token');
            const resultDiv = document.getElementById('corsResult');
            
            if (!token) {
                resultDiv.textContent = 'No token found! Please login first in the main app.';
                return;
            }
            
            resultDiv.textContent = 'Testing with token...';
            
            try {
                const response = await fetch('http://localhost:8080/users', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    credentials: 'include'
                });
                
                const text = await response.text();
                resultDiv.textContent = 
                    `Token Test Result:\n` +
                    `Status: ${response.status} ${response.statusText}\n` +
                    `Response: ${text}`;
                    
            } catch (error) {
                resultDiv.textContent = 
                    `Token Test Error:\n` +
                    `${error.message}\n\n` +
                    `This indicates a CORS or authentication issue.`;
            }
        }
    </script>
</body>
</html>
