
<form nz-form [formGroup]="userForm" (ngSubmit)="submitForm()">

  <nz-form-item>
    <nz-form-label [nzSpan]="6" nzRequired>Username</nz-form-label>
    <nz-form-control [nzSpan]="16" nzErrorTip="Vui lòng nhập username!">
      <input nz-input formControlName="username" placeholder="Nhập username" />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label [nzSpan]="6" nzRequired>Họ và tên</nz-form-label>
    <nz-form-control [nzSpan]="16" nzErrorTip="Vui lòng nhập họ và tên!">
      <input nz-input formControlName="fullName" placeholder="Nhập họ và tên" />
    </nz-form-control>
  </nz-form-item>



  <nz-form-item>
    <nz-form-label [nzSpan]="6" nzRequired>Vai trò</nz-form-label>
    <nz-form-control [nzSpan]="16" nzErrorTip="Chọn vai trò!">
      <nz-select formControlName="role" placeholder="Chọn vai trò">
        <nz-option *ngFor="let r of roles" [nzValue]="r" [nzLabel]="r"></nz-option>
      </nz-select>
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label [nzSpan]="6" nzRequired>Trạng thái</nz-form-label>
    <nz-form-control [nzSpan]="16" nzErrorTip="Chọn trạng thái!">
      <nz-select formControlName="isActive" placeholder="Chọn trạng thái">
        <nz-option *ngFor="let s of statusOptions" [nzValue]="s.value" [nzLabel]="s.label"></nz-option>
      </nz-select>
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label [nzSpan]="6">Mật khẩu mới</nz-form-label>
    <nz-form-control [nzSpan]="16">
      <input nz-input type="password" formControlName="password" placeholder="Để trống nếu không đổi mật khẩu" />
      <div style="font-size: 12px; color: #888; margin-top: 2px;">Nếu không muốn đổi mật khẩu, hãy để trống trường này.</div>
    </nz-form-control>
  </nz-form-item>

  <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px;">
    <button nz-button nzType="default" (click)="cancel()">Hủy</button>
    <button nz-button nzType="primary" [disabled]="userForm.invalid" [nzLoading]="isSubmitting">
      Cập nhật
    </button>
  </div>
</form>
