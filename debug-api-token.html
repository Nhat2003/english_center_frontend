<!DOCTYPE html>
<html>
<head>
    <title>Test API with Token</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 20px; border: 1px solid #ccc; }
        button { padding: 10px 20px; margin: 10px; }
        .result { background: #f5f5f5; padding: 10px; margin: 10px 0; white-space: pre-wrap; }
        .error { background: #ffe6e6; color: red; }
        .success { background: #e6ffe6; color: green; }
    </style>
</head>
<body>
    <h2>Test API with Token</h2>

    <div class="section">
        <h3>1. Đăng nhập để lấy token</h3>
        <input type="text" id="username" placeholder="Username" value="admin">
        <input type="password" id="password" placeholder="Password" value="123">
        <button onclick="login()">Login</button>

        <div id="loginResult" class="result"></div>
        <div>Token: <span id="tokenDisplay"></span></div>
    </div>

    <div class="section">
        <h3>2. Test API calls với token</h3>
        <button onclick="testClasses()">Test /classes</button>
        <button onclick="testStudents()">Test /students</button>
        <button onclick="testTeachers()">Test /teachers</button>

        <div id="apiResult" class="result"></div>
    </div>

    <script>
        let authToken = '';

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('http://localhost:8080/users/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.token) {
                    authToken = data.token;
                    document.getElementById('tokenDisplay').textContent = authToken.substring(0, 50) + '...';
                    document.getElementById('loginResult').innerHTML =
                        `<div class="success">Đăng nhập thành công!\nUser: ${JSON.stringify(data.user, null, 2)}</div>`;
                } else {
                    document.getElementById('loginResult').innerHTML =
                        `<div class="error">Đăng nhập thất bại!\n${JSON.stringify(data, null, 2)}</div>`;
                }

            } catch (error) {
                document.getElementById('loginResult').innerHTML =
                    `<div class="error">Lỗi: ${error.message}</div>`;
            }
        }

        async function testApi(endpoint) {
            if (!authToken) {
                alert('Vui lòng đăng nhập trước!');
                return;
            }

            try {
                const response = await fetch(`http://localhost:8080${endpoint}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById('apiResult').innerHTML =
                        `<div class="success">✅ ${endpoint} thành công!\n${JSON.stringify(data, null, 2)}</div>`;
                } else {
                    document.getElementById('apiResult').innerHTML =
                        `<div class="error">❌ ${endpoint} thất bại!\nStatus: ${response.status}\n${JSON.stringify(data, null, 2)}</div>`;
                }

            } catch (error) {
                document.getElementById('apiResult').innerHTML =
                    `<div class="error">❌ Lỗi ${endpoint}: ${error.message}</div>`;
            }
        }

        function testClasses() {
            testApi('/classes');
        }

        function testStudents() {
            testApi('/students');
        }

        function testTeachers() {
            testApi('/teachers');
        }
    </script>
</body>
</html>
