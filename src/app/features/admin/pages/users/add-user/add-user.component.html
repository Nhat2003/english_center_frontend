<form nz-form [formGroup]="userForm" (ngSubmit)="submitForm()" class="p-4 max-w-xl mx-auto">


<!-- Username -->
  <nz-form-item>
    <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired>Tên đăng nhập</nz-form-label>
    <nz-form-control [nzSm]="14" [nzXs]="24" nzErrorTip="Tên đăng nhập từ 3-20 ký tự!">
      <input nz-input formControlName="username" placeholder="Nhập tên đăng nhập" />
    </nz-form-control>
  </nz-form-item>

  <!-- Họ và tên -->
  <nz-form-item>
    <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired>Họ và tên</nz-form-label>
    <nz-form-control [nzSm]="14" [nzXs]="24" nzErrorTip="Vui lòng nhập họ và tên!">
      <input nz-input formControlName="fullName" placeholder="Nhập họ và tên" />
    </nz-form-control>
  </nz-form-item>


  <!-- Mật khẩu -->
  <nz-form-item>
    <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired>Mật khẩu</nz-form-label>
    <nz-form-control [nzSm]="14" [nzXs]="24" nzErrorTip="Mật khẩu tối thiểu 6 ký tự!">
      <input nz-input type="password" formControlName="password" placeholder="Nhập mật khẩu" />
    </nz-form-control>
  </nz-form-item>

   <!-- Vai trò -->
   <nz-form-item>
    <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired>Vai trò</nz-form-label>
    <nz-form-control [nzSm]="14" [nzXs]="24" nzErrorTip="Vui lòng chọn vai trò!">
      <nz-select formControlName="role" placeholder="Chọn vai trò">
        <nz-option *ngFor="let r of roles" [nzValue]="r" [nzLabel]="r"></nz-option>
      </nz-select>
    </nz-form-control>
  </nz-form-item>

  <!-- Nút submit -->
 <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px;">
    <button nz-button nzType="default" (click)="cancel()">Hủy</button>
    <button nz-button nzType="primary" [disabled]="userForm.invalid">Thêm User</button>

  </div>
</form>
