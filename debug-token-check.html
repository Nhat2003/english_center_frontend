<!DOCTYPE html>
<html>
<head>
    <title>Debug Token Check</title>
</head>
<body>
    <h2>Token Debug Tool</h2>

    <div>
        <h3>Current Token:</h3>
        <textarea id="tokenDisplay" style="width: 100%; height: 100px;" readonly></textarea>
        <button onclick="checkToken()">Check Token</button>
        <button onclick="clearToken()">Clear Token</button>
    </div>

    <div>
        <h3>Test API Call with Token:</h3>
        <button onclick="testUsersAPI()">Test /users API</button>
        <button onclick="testTeachersAPI()">Test /teachers API</button>
        <button onclick="testStudentsAPI()">Test /students API</button>
        <div id="apiResult" style="margin-top: 10px; padding: 10px; border: 1px solid #ccc; min-height: 100px; white-space: pre-wrap;"></div>
    </div>

    <script>
        function checkToken() {
            const token = localStorage.getItem('token');
            const user = localStorage.getItem('user');

            document.getElementById('tokenDisplay').value =
                `Token: ${token || 'No token found'}\n\n` +
                `User: ${user || 'No user found'}`;
        }

        function clearToken() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            alert('Token and user cleared');
            checkToken();
        }

        async function testUsersAPI() {
            await testAPI('/users', 'Users API');
        }

        async function testTeachersAPI() {
            await testAPI('/teachers', 'Teachers API');
        }

        async function testStudentsAPI() {
            await testAPI('/students', 'Students API');
        }

        async function testAPI(endpoint, name) {
            const token = localStorage.getItem('token');
            const resultDiv = document.getElementById('apiResult');

            if (!token) {
                resultDiv.textContent = 'No token found! Please login first.';
                return;
            }

            try {
                resultDiv.textContent = `Testing ${name}...`;

                const response = await fetch(`http://localhost:8080${endpoint}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                const responseText = await response.text();
                let responseData;

                try {
                    responseData = JSON.parse(responseText);
                } catch {
                    responseData = responseText;
                }

                resultDiv.textContent =
                    `${name} Result:\n` +
                    `Status: ${response.status} ${response.statusText}\n` +
                    `Response: ${JSON.stringify(responseData, null, 2)}`;

            } catch (error) {
                resultDiv.textContent =
                    `${name} Error:\n` +
                    `${error.message}\n` +
                    `This might be a CORS issue or server is not running.`;
            }
        }

        // Auto-check token when page loads
        window.onload = checkToken;
    </script>
</body>
</html>
