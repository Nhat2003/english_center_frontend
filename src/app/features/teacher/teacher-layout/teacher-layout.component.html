<nz-layout class="teacher-layout">
  <!-- Header -->
  <nz-header class="header">
    <div class="logo">
          <button
        nz-button
        nzType="text"
        nzSize="large"
        (click)="isCollapsed = !isCollapsed"
        class="trigger">
        <span nz-icon [nzType]="isCollapsed ? 'menu-unfold' : 'menu-fold'"></span>
      </button>
      <span nz-icon nzType="graduation-cap" nzTheme="outline"></span>
      <span class="title">English Center - Teacher</span>
    </div>

    <div class="header-right">
      <nz-dropdown nzTrigger="click" [nzPlacement]="'bottomRight'">
        <div class="user-info" nz-dropdown>
          <nz-avatar nzIcon="user" [nzSize]="32"></nz-avatar>
          <span class="username">{{ currentUser?.fullName || currentUser?.username }}</span>
          <span nz-icon nzType="down"></span>
        </div>
        <ul nz-menu nzSelectable="false">
          <li nz-menu-item>
            <span nz-icon nzType="user"></span>
            Thông tin cá nhân
          </li>
          <li nz-menu-item>
            <span nz-icon nzType="setting"></span>
            Cài đặt
          </li>
          <li nz-menu-divider></li>
          <li nz-menu-item (click)="logout()">
            <span nz-icon nzType="logout"></span>
            Đăng xuất
          </li>
        </ul>
      </nz-dropdown>


    </div>
  </nz-header>

  <nz-layout>
    <!-- Sidebar -->
    <nz-sider
      class="sidebar"
      nzCollapsible
      [(nzCollapsed)]="isCollapsed"
      [nzTrigger]="null"
      nzWidth="250px">
      <ul nz-menu nzMode="inline" [nzInlineCollapsed]="isCollapsed" class="sidebar-menu">

        <!-- 🏠 Trang chủ -->
        <li nz-menu-item routerLink="/teacher/dashboard" routerLinkActive="ant-menu-item-selected">
          <span class="menu-emoji">🏠</span>
          <span>Trang chủ</span>
        </li>

        <!-- 📅 Lịch dạy -->
        <li nz-menu-item routerLink="/teacher/schedule" routerLinkActive="ant-menu-item-selected">
          <span class="menu-emoji">📅</span>
          <span>Lịch dạy</span>
        </li>

        <!-- 👨‍🎓 Danh sách lớp & học sinh -->
        <li nz-menu-item routerLink="/teacher/classes" routerLinkActive="ant-menu-item-selected">
          <span class="menu-emoji">👨‍🎓</span>
          <span>Danh sách lớp & học sinh</span>
        </li>

        <!-- 📝 Quản lý bài tập -->
        <li nz-menu-item routerLink="/teacher/assignments" routerLinkActive="ant-menu-item-selected">
          <span class="menu-emoji">📝</span>
          <span>Quản lý bài tập</span>
        </li>

        <!-- 🎥 Phòng học online -->
        <li nz-menu-item routerLink="/teacher/online-classes" routerLinkActive="ant-menu-item-selected">
          <span class="menu-emoji">🎥</span>
          <span>Phòng học online</span>
        </li>

        <!-- 📚 Tài liệu giảng dạy -->
        <li nz-menu-item routerLink="/teacher/materials" routerLinkActive="ant-menu-item-selected">
          <span class="menu-emoji">📚</span>
          <span>Tài liệu giảng dạy</span>
        </li>

        <!-- 📢 Thông báo cho học sinh -->
        <li nz-menu-item routerLink="/teacher/notifications" routerLinkActive="ant-menu-item-selected">
          <span class="menu-emoji">📢</span>
          <span>Thông báo cho học sinh</span>
          <nz-badge [nzCount]="newNotifications" *ngIf="newNotifications > 0" class="notification-badge"></nz-badge>
        </li>

      </ul>
    </nz-sider>

    <!-- Content -->
    <nz-layout class="inner-layout">
      <nz-content class="content">
        <div class="content-wrapper">
          <router-outlet></router-outlet>
        </div>
      </nz-content>
    </nz-layout>
  </nz-layout>
</nz-layout>
