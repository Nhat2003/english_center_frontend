<nz-layout class="student-layout">
  <!-- Header -->
  <nz-header class="header">
    <div class="logo">
      <button
        nz-button
        nzType="text"
        nzSize="large"
        (click)="isCollapsed = !isCollapsed"
        class="trigger">
        <span nz-icon [nzType]="isCollapsed ? 'menu-unfold' : 'menu-fold'"></span>
      </button>
      <div class="logo-wrapper">
        <div class="logo-icon">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <!-- Graduation Cap -->
            <path d="M50 20 L10 35 L50 50 L90 35 L50 20 Z" fill="#3bb273"/>
            <path d="M50 50 L90 35 L90 55 L50 70 L10 55 L10 35 L50 50 Z" fill="#2d9960" opacity="0.8"/>
            <!-- Tassel -->
            <circle cx="50" cy="20" r="3" fill="#faad14"/>
            <line x1="50" y1="20" x2="50" y2="12" stroke="#faad14" stroke-width="2"/>
          </svg>
        </div>
        <div class="logo-text">
          <div class="brand-name">TOEIC DOWNTOWN</div>
          <div class="brand-subtitle">Student Portal</div>
        </div>
      </div>
    </div>

    <div class="header-right">
      <nz-dropdown nzTrigger="click" [nzPlacement]="'bottomRight'">
        <div class="user-info" nz-dropdown>
          <nz-avatar nzIcon="user" [nzSize]="32"></nz-avatar>
          <span class="username">{{ currentUser?.fullName  }}</span>
          <span nz-icon nzType="down"></span>
        </div>
        <ul nz-menu nzSelectable="false">
          <li nz-menu-item>
            <span nz-icon nzType="user"></span>
            Thông tin cá nhân
          </li>
          <li nz-menu-item>
            <span nz-icon nzType="setting"></span>
            Cài đặt
          </li>
          <li nz-menu-divider></li>
          <li nz-menu-item (click)="logout()">
            <span nz-icon nzType="logout"></span>
            Đăng xuất
          </li>
        </ul>
      </nz-dropdown>


    </div>
  </nz-header>

  <nz-layout>
    <!-- Sidebar -->
    <nz-sider
      class="sidebar"
      nzCollapsible
      [(nzCollapsed)]="isCollapsed"
      [nzTrigger]="null"
      nzWidth="250px">
      <ul nz-menu nzMode="inline" [nzInlineCollapsed]="isCollapsed" class="sidebar-menu">

        <!-- Trang chủ - Dashboard tổng quan -->
        <li nz-menu-item routerLink="/student/dashboard" routerLinkActive="ant-menu-item-selected">
          <span nz-icon nzType="home"></span>
          <span>Trang chủ</span>
        </li>

        <!-- Lịch học -->
        <li nz-menu-item routerLink="/student/schedule" routerLinkActive="ant-menu-item-selected">
          <span nz-icon nzType="calendar"></span>
          <span>Lịch học</span>
        </li>

        <!-- Bài tập & Kết quả -->
        <li nz-menu-item routerLink="/student/assignments" routerLinkActive="ant-menu-item-selected">
          <span nz-icon nzType="file-text"></span>
          <span>Bài tập & Kết quả</span>
        </li>

        <!-- Học phí & Thanh toán -->
        <li nz-menu-item routerLink="/student/payments" routerLinkActive="ant-menu-item-selected">
          <span nz-icon nzType="credit-card"></span>
          <span>Học phí & Thanh toán</span>
        </li>

        <!-- Phòng học online -->
        <li nz-menu-item routerLink="/student/online-classes" routerLinkActive="ant-menu-item-selected">
          <span nz-icon nzType="video-camera"></span>
          <span>Phòng học online</span>
        </li>

        <!-- Tài liệu học tập -->
        <li nz-menu-item routerLink="/student/documents" routerLinkActive="ant-menu-item-selected">
          <span nz-icon nzType="book"></span>
          <span>Tài liệu học tập</span>
        </li>

        <!-- Thông báo -->
        <li nz-menu-item routerLink="/student/notifications" routerLinkActive="ant-menu-item-selected">
          <nz-badge [nzCount]="newNotifications" nzSize="small">
            <span nz-icon nzType="bell"></span>
            <span>Thông báo</span>
          </nz-badge>
        </li>

      </ul>


    </nz-sider>

    <!-- Content -->
    <nz-layout class="inner-layout">
      <nz-content class="content">
        <div class="content-wrapper">
          <router-outlet></router-outlet>
        </div>
      </nz-content>
    </nz-layout>
  </nz-layout>
</nz-layout>
